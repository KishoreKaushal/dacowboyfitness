name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_staging:
    name: Deploy to Staging (Live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Validate journal JSON is up to date
        run: |
          pip install -r scripts/requirements.txt -q
          python3 scripts/build_journals.py
          git diff --exit-code public/content/journals/ \
            || (echo "ERROR: public/content/journals/ is out of sync with journals/*.md" \
                && echo "Run 'npm run build:journals' locally and commit the result." \
                && exit 1)
      - run: npm ci
      - run: npm run build:staging
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_STAGE || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_STAGE || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID_STAGE || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_STAGE || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_STAGE || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID_STAGE || secrets.VITE_FIREBASE_APP_ID }}
      - name: Build Functions
        run: npm ci && npm run build
        working-directory: functions
      - name: Deploy Functions and Rules
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_DACOWBOYFITNESS_STAGE }}" > sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa.json
          npx firebase-tools deploy --only functions,firestore:rules --project dacowboyfitness-stage
          rm sa.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DACOWBOYFITNESS_STAGE }}
          channelId: live
          projectId: dacowboyfitness-stage
